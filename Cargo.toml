[package]
name = "rust-cli-template"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rust-cli-template"
path = "src/bin/main.rs"

[dependencies]
async-trait = "0.1.89"
bon = "3.8.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
functional-kube = "0.1.0"
k8s-openapi = { version = "0.26.1", features = ["v1_34"] }
kube = { version = "2.0.1", features = ["derive", "runtime", "client"] }
miette = { version = "7.6.0", features = ["fancy"] }
nutype = { version = "0.6.2", features = ["serde"] }
pretty_assertions = "1.4.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = { version = "1.0.0", features = ["chrono04"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
static_assertions = "1.1.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tracing = { version = "0.1.43", features = ["attributes"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
